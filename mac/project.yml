# XcodeGen spec for the Mac app. Generate the Xcode project with:
#   make project        (or: cd mac && xcodegen generate)
# The generated Notr.xcodeproj is not checked in; edit this file instead.
name: Notr
options:
  bundleIdPrefix: app.notr
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Notr:
    type: application
    platform: macOS
    sources:
      - path: Notr
      # The built web editor (npm run build -> out/), copied here by `make web`.
      # Bundled as a folder reference so it lands at Contents/Resources/web.
      - path: web
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_NAME: Notr
        PRODUCT_BUNDLE_IDENTIFIER: app.notr.Notr
        INFOPLIST_FILE: Notr/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
        # Ad-hoc signing by default so anyone can build. Release CI re-signs
        # with a Developer ID when signing secrets are configured.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
    preBuildScripts:
      - name: Check web bundle
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/web/index.html" ]; then
            echo "error: The web editor isn't built. Run 'make web' from the repository root, then build again."
            exit 1
          fi
