name: Release

# Push a tag like v0.2.0 to build Notr.app, package a .dmg and publish a
# GitHub release. Without signing secrets the app is ad-hoc signed; see
# "Signed releases" in the README to ship a notarized build instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 (creates a draft release)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install xcodegen

      - name: Resolve version
        run: |
          v="${VERSION#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=v$v" >> "$GITHUB_ENV"
          echo "DMG=build/Notr-$v.dmg" >> "$GITHUB_ENV"

      - name: Build Notr.app
        run: make app VERSION="$VERSION" BUILD="${{ github.run_number }}"

      - name: Import signing certificate
        id: cert
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "No signing certificate configured; the app stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Sign, package and notarize
        if: steps.cert.outputs.signed == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/sign-and-notarize.sh build/Release/Notr.app "$DMG"

      - name: Package (ad-hoc signed)
        if: steps.cert.outputs.signed != 'true'
        run: scripts/make-dmg.sh build/Release/Notr.app "$DMG"

      - name: Checksum
        run: |
          cd build
          shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256"
          cat "$(basename "$DMG").sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Notr-${{ env.VERSION }}
          path: |
            ${{ env.DMG }}
            ${{ env.DMG }}.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.cert.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            notes="Download **Notr-$VERSION.dmg**, open it and drag Notr to Applications."
          else
            notes="Download **Notr-$VERSION.dmg**, open it and drag Notr to Applications.

          This build isn't notarized by Apple, so macOS blocks it the first time. Open it once, then go to **System Settings > Privacy & Security** and click **Open Anyway**. See the README for details."
          fi
          draft=""
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && draft="--draft --target ${{ github.sha }}"
          gh release create "$TAG" "$DMG" "$DMG.sha256" \
            --title "Notr $VERSION" \
            --notes "$notes" \
            --generate-notes \
            $draft
